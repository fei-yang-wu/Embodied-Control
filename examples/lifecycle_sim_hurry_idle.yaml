# Sim rehearsal of the hoist-to-run lifecycle with the real SONIC bundle and
# the stationary hurry_idle reference, against the vendored MuJoCo plant.
#
#   T0  pixi run -e native ec lowlevel plant examples/g1_plant.yaml \
#         --model assets/latent_playkit/model/g1_29dof_rev_1_0.xml --network lo \
#         --vendor --hoist --dds-domain 51 --report artifacts/lifecycle_sim/plant.json
#   T1  pixi run -e native ec lowlevel oracle-worker assets/latent_playkit/bundles/fsq64_sonic_4500m \
#         --reference-root assets/latent_playkit/reference/root_qpos_v1 \
#         --motion hurry_idle_001_A277 --request-slot /ec_g1_request \
#         --response-slot /ec_g1_response --create-slots
#   T2  pixi run -e native ec lifecycle run examples/lifecycle_sim_hurry_idle.yaml \
#         --enable-writes --confirm ENABLE_G1_LOWLEVEL_NON_REALTIME \
#         --allow-non-realtime --go --recover
#
# Against the robot: change network to the NIC, dds_domain to 0, sim_hoist to
# false, and drop --allow-non-realtime.
api_version: ec.lifecycle/v1alpha1
bundle: ../assets/latent_playkit/bundles/fsq64_sonic_4500m
# Extra tracker bundles appear in the panel and cycle with t/T.
# trackers:
#   second-controller: ../assets/model/controller/second-controller-bundle
network: lo
dds_domain: 51
request_slot: /ec_g1_request
response_slot: /ec_g1_response
connect_slots: true
command_source: oracle
reference_root: ../assets/latent_playkit/reference/root_qpos_v1
motion: hurry_idle_001_A277
start_frame: 0
fixed_initial_anchor: true
start_pose: motion
ramp_seconds: 3.0
ticks: 504
blend_ticks: 250
# An episode rests limp under the vendor and the next one climbs PRECHECK
# again. `s` in the console still recovers to a vendor stand.
end_state: vendor_damp
sim_hoist: true
artifacts_dir: ../artifacts/lifecycle_sim
# In-line MPJPE per episode (forward kinematics through the playkit MJCF).
mjcf: ../assets/latent_playkit/model/g1_29dof_rev_1_0.xml
realtime:
  control_cpu: -1
  writer_cpu: -1
  control_priority: 0
  writer_priority: 0
  lock_memory: false
  policy_threads: 1
thresholds:
  settle_timeout_seconds: 15.0
