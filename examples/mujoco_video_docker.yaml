# MuJoCo eval with the policy in its own DOCKER CONTAINER *and* a rendered
# video. Proves these are orthogonal: video rendering happens on the host
# (MuJoCo is always in-process/stepped) regardless of where the policy runs.
# Build the image first:
#     pixi run build-policy-image        # -> ec-policy-debug:latest
# Then run (needs docker daemon access; use `newgrp docker` / reboot if needed):
#     pixi run -e sim smoke-video-docker
api_version: ec.eval/v1alpha1
name: mujoco_reacher_random_video_docker
seed: 7
tags:
  simulator: mujoco
  policy_family: random
  runtime: docker
  purpose: video_smoke_test

sim:
  backend: mujoco
  mode: stepped
  model: reacher2
  backend_config:
    success_threshold: 0.04

policy:
  type: random
  runtime:
    type: docker
    image: ec-policy-debug:latest   # digest-pin for serious runs
    container_port: 8000
  requested_action_horizon: 20  # hold each random target ~20 steps so the arm tracks it
  action_chunk_mode: sync

embodiment:
  adapter: passthrough
  clip_actions: true
  fallback_action: zero

rollout:
  num_episodes: 2
  max_steps_per_episode: 150
  record_raw: true
  record_video: true
  video_fps: 30

outputs:
  root_dir: ./runs
  run_name_template: "{date}_{name}_{seed}"
