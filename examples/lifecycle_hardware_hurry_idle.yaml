# Real G1 hardware session, same bundle + reference already rehearsed in sim
# via examples/lifecycle_sim_sonic_v1_1.yaml (the rehearsal gate below matches
# on bundle sha, motion and command source, so the sim job and this one have
# to name the same bundle). Robot stays hoisted for the whole hardware ladder (docs/design/robot_lifecycle.md M4, H0-H3) until an
# operator has confirmed FSM behavior and settle thresholds on real motors.
#
#   T0  pixi run -e native ec lowlevel oracle-worker assets/models/controller/sonic_v1_1 \
#         --reference-root assets/models/reference/root_qpos_v1 \
#         --motion hurry_idle_001_A277 --request-slot /ec_g1_request \
#         --response-slot /ec_g1_response --create-slots
#   T1  pixi run -e native ec lifecycle console examples/lifecycle_hardware_hurry_idle.yaml \
#         --network <robot NIC, e.g. `ip -brief addr` for the enx... device> \
#         --enable-writes --confirm ENABLE_G1_LOWLEVEL_NON_REALTIME
#
# --network has no default below because the NIC name is a udev-assigned
# enx<mac> string that can change if the USB adapter moves ports; always
# pass the current one explicitly rather than trusting this file.
#
# Console gates every state transition on an operator keypress (no
# --auto-ack here) — advance one rung at a time, don't jump straight to
# `go`. Robot must be damped and hoisted before PRECHECK.
api_version: ec.lifecycle/v1alpha1
bundle: ../assets/models/controller/sonic_v1_1
trackers:
  # Every pinned controller bundle is selectable with `t`/`T`; the console
  # restarts the oracle worker for the bundle it switches to, so the encoder
  # contract (SONIC v1.1 is stride 5 over qvel, the fsq64 bundles stride 1)
  # follows the selection instead of being fixed at startup.
  sonic_v1_1: ../assets/models/controller/sonic_v1_1
  fsq64_sonic_4500m: ../assets/models/controller/fsq64_sonic_4500m
  fsq64_10b: ../assets/models/controller/fsq64_10b
  rollout24_gamma097_3500m: ../assets/models/controller/rollout24_gamma097_3500m
network: ""
dds_domain: 0
request_slot: /ec_g1_request
response_slot: /ec_g1_response
connect_slots: true
command_source: oracle
reference_root: ../assets/models/reference/root_qpos_v1
motion: hurry_idle_001_A277
start_frame: 0
fixed_initial_anchor: true
start_pose: motion
ramp_seconds: 3.0
ticks: 504
blend_ticks: 250
# An episode rests limp under the vendor and the next one climbs PRECHECK
# again. `s` in the console still recovers to a vendor stand.
end_state: vendor_damp
# Hardware runs what the plant already ran: PRECHECK refuses until a passing
# rehearsal of this bundle and motion exists under `rehearsal_root`, which
# defaults to the parent of `artifacts_dir`.
require_rehearsal: true
rehearsal_root: ../artifacts
rehearsal_max_age_days: 14.0
# Real vendor sport service, not the plant's — read at PRECHECK from
# CheckMode rather than assumed.
vendor_name: ""
require_vendor: true
sim_hoist: false
artifacts_dir: ../artifacts/lifecycle_hardware
mjcf: ../assets/latent_playkit/model/g1_29dof_rev_1_0.xml
thresholds:
  settle_timeout_seconds: 15.0
