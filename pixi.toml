[workspace]
name = "embodied-control"
version = "0.1.0"
description = "Pixi-managed host orchestrator for isolated VLA policy / simulator evaluation."
authors = ["Embodied Control Contributors"]
channels = ["conda-forge"]
platforms = ["linux-64"]

# Host tooling stays light: the default environment carries only the orchestrator,
# schemas, CLI, transport client, and the stdlib policy service. Heavyweight
# simulator dependencies (MuJoCo) live in the `sim` feature environment, and the
# blank VLA policy service runs in its own Docker container (see containers/).

[tasks]
doctor = "ec doctor"
test = "pytest -q"
# Run the blank policy service standalone (manual / debugging):
policy-serve = "ec policy serve --type zero --action-dim 2 --host 127.0.0.1 --port 8756"
policy-ping = "ec policy ping --endpoint 127.0.0.1:8756"
build-policy-image = "bash scripts/build_policy_image.sh"
# Delegated-mode eval: neither the host nor the two runtimes need MuJoCo, so
# these run in the light default env (no `-e sim` needed).
smoke-delegated = "ec eval run examples/fake_delegated_local.yaml"
build-fake-delegated-image = "bash scripts/build_fake_delegated_image.sh"
smoke-delegated-docker = "ec eval run examples/fake_delegated_docker.yaml"
# Real LIBERO backend: also no MuJoCo needed on the host (LIBERO's own MuJoCo
# lives inside its own container's Python 3.8 env, unrelated to the host's).
build-libero-image = "bash scripts/build_libero_image.sh"
smoke-libero = "ec eval run examples/libero_docker.yaml"
smoke-libero-video = "ec eval run examples/libero_video_docker.yaml"
smoke-libero-image-stats = "ec eval run examples/libero_image_stats_docker.yaml"
# Push to ghcr.io (see scripts/push_image.sh for one-time auth setup).
push-policy-image = "bash scripts/push_image.sh ec-policy-debug:latest"
push-fake-delegated-image = "bash scripts/push_image.sh ec-fake-delegated-eval:latest"
push-libero-image = "bash scripts/push_image.sh ec-libero-eval:latest"

[dependencies]
python = ">=3.13,<3.14"
pip = "*"
pytest = ">=8,<9"
pydantic = ">=2,<3"
pyyaml = ">=6,<7"

[pypi-dependencies]
embodied-control = { path = ".", editable = true }

# --- sim feature: MuJoCo stepped backend (kept out of the light default env) ---
[feature.sim.dependencies]
mujoco = ">=3,<4"
numpy = ">=1.24"
imageio = ">=2.30"
imageio-ffmpeg = ">=0.4"

[feature.sim.tasks]
# These require MuJoCo, so they live in the sim environment: `pixi run -e sim smoke`.
smoke = "ec eval run examples/mujoco_zero_local.yaml"
smoke-random = "ec eval run examples/mujoco_random_local.yaml"
smoke-docker = "ec eval run examples/mujoco_zero.yaml"
smoke-video = "ec eval run examples/mujoco_random_video.yaml"
smoke-video-docker = "ec eval run examples/mujoco_video_docker.yaml"
test-sim = "pytest -q"

# --- transports feature: real-policy client adapters (OpenPI, GR00T) ---
# These deps (websockets, msgpack, pyzmq) are never bundled into the tiny
# stdlib-only containers (fake_delegated_eval) -- only LIBERO's container,
# which already carries numpy, would ever import these client modules for
# real. This env exists so the *client/translation* code itself has test
# coverage on the host without needing a GPU or a real checkpoint (see
# docs/design/real_policy_adapters.md, M2).
[feature.transports.dependencies]
numpy = ">=1.24"
websockets = ">=12"
msgpack-python = ">=1.0"
msgpack-numpy = ">=0.4"
pyzmq = ">=25"

[feature.transports.tasks]
test-transports = "pytest -q tests/test_openpi_client.py tests/test_gr00t_client.py"

[environments]
sim = ["sim"]
transports = ["transports"]
