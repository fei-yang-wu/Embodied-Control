[workspace]
name = "embodied-control"
version = "0.1.0"
description = "Pixi-managed host orchestrator for isolated VLA policy / simulator evaluation."
authors = ["Embodied Control Contributors"]
channels = ["conda-forge"]
# osx-arm64 exists for the latent-lab notebook flow on Apple-Silicon macs
# (CPU tracker + MuJoCo); the native C++ tier stays linux-only below.
platforms = ["linux-64", "osx-arm64"]

# Host tooling stays light: the default environment carries only the orchestrator,
# schemas, CLI, transport client, and the stdlib policy service. Heavyweight
# simulator dependencies (MuJoCo) live in the `sim` feature environment, and the
# blank VLA policy service runs in its own Docker container (see containers/).

[tasks]
doctor = "ec doctor"
test = "pytest -q"
# Run the blank policy service standalone (manual / debugging):
policy-serve = "ec policy serve --type zero --action-dim 2 --host 127.0.0.1 --port 8756"
policy-ping = "ec policy ping --endpoint 127.0.0.1:8756"
build-policy-image = "bash scripts/build_policy_image.sh"
# Delegated-mode eval: neither the host nor the two runtimes need MuJoCo, so
# these run in the light default env (no `-e sim` needed).
smoke-delegated = "ec eval run examples/fake_delegated_local.yaml"
build-fake-delegated-image = "bash scripts/build_fake_delegated_image.sh"
smoke-delegated-docker = "ec eval run examples/fake_delegated_docker.yaml"
# Real LIBERO backend: also no MuJoCo needed on the host (LIBERO's own MuJoCo
# lives inside its own container's Python 3.8 env, unrelated to the host's).
build-libero-image = "bash scripts/build_libero_image.sh"
smoke-libero = "ec eval run examples/libero_docker.yaml"
smoke-libero-video = "ec eval run examples/libero_video_docker.yaml"
smoke-libero-image-stats = "ec eval run examples/libero_image_stats_docker.yaml"
# Push to ghcr.io (see scripts/push_image.sh for one-time auth setup).
push-policy-image = "bash scripts/push_image.sh ec-policy-debug:latest"
push-fake-delegated-image = "bash scripts/push_image.sh ec-fake-delegated-eval:latest"
push-libero-image = "bash scripts/push_image.sh ec-libero-eval:latest"

[dependencies]
python = ">=3.13,<3.14"
pip = "*"
pytest = ">=8,<9"
pydantic = ">=2,<3"
pyyaml = ">=6,<7"

[pypi-dependencies]
embodied-control = { path = ".", editable = true }

# --- sim feature: MuJoCo stepped backend (kept out of the light default env) ---
[feature.sim.dependencies]
mujoco = ">=3,<4"
numpy = ">=1.24"
imageio = ">=2.30"
imageio-ffmpeg = ">=0.4"
ffmpeg = ">=6"

[feature.sim.tasks]
# These require MuJoCo, so they live in the sim environment: `pixi run -e sim smoke`.
smoke = "ec eval run examples/mujoco_zero_local.yaml"
smoke-random = "ec eval run examples/mujoco_random_local.yaml"
smoke-docker = "ec eval run examples/mujoco_zero.yaml"
smoke-video = "ec eval run examples/mujoco_random_video.yaml"
smoke-video-docker = "ec eval run examples/mujoco_video_docker.yaml"
smoke-wuji-vega = "ec eval run examples/wuji_vega_grasp_oracle_local.yaml"
test-sim = "pytest -q"

# --- transports feature: real-policy client adapters (OpenPI, GR00T) ---
# These deps are never bundled into the tiny stdlib-only containers
# (fake_delegated_eval) -- only LIBERO's container, which already carries
# numpy, would ever import these client modules for real. This env exists so
# the *client/translation* code itself has test coverage on the host without
# needing a GPU or a real checkpoint (see docs/design/real_policy_adapters.md).
#
# openpi-client (real PyPI package, not our own reimplementation) is used
# for OpenPI's wire mechanics -- verified against a live server (2026-07-15)
# that the generic msgpack-numpy package's envelope (`nd`/`type`/`kind`) is
# NOT wire-compatible with OpenPI's server, which uses its own custom
# envelope (`__ndarray__`/`dtype`) baked into openpi-client's msgpack_numpy.py.
# GR00T's real server calls the generic package's own encode/decode functions
# directly (verified in gr00t/policy/server_client.py), so msgpack-numpy
# stays correct for that adapter -- this mismatch is OpenPI-specific.
[feature.transports.dependencies]
numpy = ">=1.24"
websockets = ">=12"
msgpack-python = ">=1.0"
msgpack-numpy = ">=0.4"  # GR00T's own server uses this package's real envelope -- see gr00t_client.py
pyzmq = ">=25"

[feature.transports.tasks]
test-transports = "pytest -q tests/test_openpi_client.py tests/test_gr00t_client.py"

# --- lowlevel feature: the 50 Hz G1 tracker runtime (policy bundles) ---
# Torch stays out of the light default env. The lowlevel package needs numpy;
# its torch engine is lazy-imported so every other module works without torch.
# tests/lowlevel/ is skipped entirely in envs without numpy (see its conftest).
[feature.lowlevel.dependencies]
numpy = ">=1.24"
pytorch = ">=2.4,<3"
msgpack-python = ">=1.0"
pyzmq = ">=25"
pyyaml = ">=6,<7"

[feature.lowlevel.tasks]
test-lowlevel = "pytest -q tests/lowlevel"
# Self-contained closed-loop smoke (synthetic bundle + fake env, no assets):
smoke-lowlevel = "pytest -q tests/lowlevel/test_torch_engine_e2e.py -k end_to_end"

# --- native feature: C++ hot-path modules (ec_native) via scikit-build-core ---
# Toolchain comes from conda-forge so builds are hermetic; install with
# --no-build-isolation so THIS cmake/compiler/pybind11 set is the one used.
# Pattern follows ~/Documents/SL/rcd with its gaps fixed (environment-provided
# dependencies, one explicit rebuild command, and no stale isolated-build
# Python path on import).
[feature.native]
platforms = ["linux-64"]

[feature.native.dependencies]
cmake = ">=3.27"
ninja = "*"
cxx-compiler = "*"
pybind11 = ">=2.12"
onnx = ">=1.17,<2"
mujoco = ">=3,<4"
imageio = ">=2.30"
imageio-ffmpeg = ">=0.4"
ffmpeg = ">=6"
pip = "*"
scikit-build-core = ">=0.10"

[feature.native.pypi-dependencies]
ec-native = { path = "native/ec_native", editable = true }

[feature.native.tasks]
build-native = "pixi reinstall -e native ec-native && python -c \"import ec_native; print(ec_native.__version__)\""
test-native = "pytest -q tests/lowlevel/test_native_shm.py tests/lowlevel/test_native_core.py tests/lowlevel/test_metrics_and_telemetry.py tests/lowlevel/test_dds_plant.py"

# --- notebook feature: the latent playground (encode z, perturb it, watch it) ---
# Jupyter and plotting on top of the lowlevel runtime + MuJoCo backend.
# Everything runs on CPU: the tracker MLP is ~2M parameters and one 500-step
# MuJoCo episode takes a couple of seconds.
[feature.notebook.dependencies]
jupyterlab = ">=4,<5"
ipywidgets = ">=8,<9"
matplotlib = ">=3.8"
pandas = ">=2,<3"
huggingface_hub = ">=0.20"

[feature.notebook.tasks]
latent-lab = "jupyter lab notebooks/"

[environments]
sim = ["sim"]
transports = ["transports"]
lowlevel = ["lowlevel"]
lowlevel-sim = ["lowlevel", "sim"]
native = ["lowlevel", "native"]
latent-lab = ["lowlevel", "sim", "notebook"]
